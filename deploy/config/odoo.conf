[options]
; Minimum setup: set db_host, db_user, db_password and admin_passwd.
; All other values have sensible defaults.

;;; Database
db_host = <postgresql-host>
; Recommended: use a dedicated user per instance (e.g., odoo10-1, odoo10-customer1)
db_user = <postgresql-user>
; Password for db_user -- must match the PostgreSQL user password
db_password = <postgresql-password>
db_name = False
db_port = False
;dbfilter = ^odoo10$
;db_maxconn = 64

;;; Security
; Master password for the database manager web UI (/web/database/manager).
; Set a strong random value. With list_db = False, the manager UI is disabled
; but admin_passwd still acts as a safety net -- never leave it empty or default.
admin_passwd = <master-password>
list_db = False

;;; Network
proxy_mode = True
;xmlrpc_port = 8069
;longpolling_port = 8072

;;; Workers
; Rule of thumb: (2 * CPU_cores) + 1. Set to 0 for threaded mode (not recommended for production).
; Memory limits and longpolling only work with workers >= 1.
workers = 2
max_cron_threads = 1

;;; Limits per worker (in bytes for memory, seconds for time)
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 60
limit_time_real = 120
limit_request = 8192

;;; Paths
data_dir = /var/lib/odoo
; Auto-generated by genaddonspath from repos.yaml -- do not edit manually
addons_path =

;;; Modules
;without_demo = True
;server_wide_modules = web,web_kanban

;;; Logging
;log_level = info
;logfile =
;syslog = False
