# Git-aggregator configuration
# See: https://github.com/acsone/git-aggregator
#
# This file contains all OCA repositories that have a 10.0 branch with
# actual Odoo modules. Repos with empty branches (no modules) are excluded.
#
# Each top-level key is a target directory relative to SRC_DIR.
# The entrypoint runs `gitaggregate -c repos.yaml aggregate` to fetch all repos.
# Then `genaddonspath` reads this file to build addons_path in odoo.conf.

######### ODOO/OCB ##################
./odoo:
    remotes:
        odoo: https://github.com/odoo/odoo.git
        ocb: https://github.com/OCA/OCB.git
    target:
        odoo 10.0
    merges:
        - odoo 10.0
        # Pull a specific PR (replace <remote> and <number>):
        # - oca refs/pull/<number>/head

######### OPENUPGRADE (database migration) ##########
# Enable this ONLY when migrating the database from a previous Odoo version.
# OpenUpgrade replaces the Odoo source with a patched fork that includes
# migration scripts. After a successful migration, disable it and switch
# back to the standard Odoo/OCB target above.
#
# ./openupgrade:
#     remotes:
#         oca: https://github.com/OCA/OpenUpgrade.git
#     target:
#         oca 10.0
#     merges:
#         - oca 10.0

######### VENDOR ADDONS ############
./vendor/nuobit-odoo-addons:
    remotes:
        nuobit: https://github.com/nuobit/odoo-addons.git
    target:
        nuobit 10.0
    merges:
        - nuobit 10.0

